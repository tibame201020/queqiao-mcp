name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --ignore-scripts --dry-run

  chrome-devtools-acceptance:
    name: Chrome DevTools MCP acceptance (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout queqiao-mcp
        uses: actions/checkout@v4
      - name: Checkout pinned Queqiao extension contract
        uses: actions/checkout@v4
        with:
          repository: tibame201020/Queqiao
          ref: 15eca5da982c6008d56a473f630ec0e4a2900285
          path: Queqiao-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run full Gateway → Worker → extension → Chrome DevTools MCP acceptance
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\accept-chrome-devtools.ps1 -QueqiaoCore .\Queqiao-core
